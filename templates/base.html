<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}Сайт{% endblock %}</title>
    <style>
        @font-face {
            font-family: "MyFont";
            src: url("{{ url_for('static', filename='fonts/myfont.ttf') }}") format("truetype");
            font-display: swap;
        }
        
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: "MyFont", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: url("{{ url_for('static', filename='images/bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            
            height: 100vh; 
            height: 100dvh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            color: #1C1C1E;
        }

        /* ОТСТУП УМЕНЬШЕН ДО 100px */
        .main-content { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 15px 15px 120px 15px; 
            width: 100%; 
            height: 100%;
        }

        /* =========================================
           КАРТОЧКА
           ========================================= */
        .card {
            position: relative;
            width: 100%; 
            max-width: 600px;
            height: 100%; 
            border-radius: 24px;
            box-shadow: 0px 6px 24px rgba(0, 0, 0, 0.2);
            isolation: isolate;
            overflow: hidden; 
        }

        .card-glass {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 0 20px -5px rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            filter: url(#glass-distortion);
        }

        .card-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            padding: 24px 24px 40px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }

        .card-content::-webkit-scrollbar { display: none; }
        .card-content { -ms-overflow-style: none; scrollbar-width: none; }

        /* =========================================
           ОФОРМЛЕНИЕ КОНТЕНТА
           ========================================= */
        .card h1 { font-size: 26px; margin-bottom: 24px; text-align: center; font-weight: 700; color: #000; letter-spacing: -0.5px; flex-shrink: 0; }
        
        input, textarea, select, button { font-family: inherit; font-size: 16px; width: 100%; outline: none; }
        
        input, textarea, select {
            padding: 16px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 16px; 
            background: rgba(255, 255, 255, 0.3); margin-bottom: 16px; transition: all 0.2s ease;
            color: #000;
            backdrop-filter: blur(4px);
        }
        input:focus, textarea:focus, select:focus { background: rgba(255, 255, 255, 0.5); border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3); }
        input::placeholder, textarea::placeholder { color: #555; }
        
        button {
            padding: 16px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 9999px; 
            background: rgba(255, 255, 255, 0.2); 
            color: #007AFF; font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-size: 17px;
            backdrop-filter: blur(3px);
        }
        button:hover { background: rgba(255, 255, 255, 0.4); }
        button:active { transform: scale(0.98); opacity: 0.8; }
        
        .btn-secondary { background: rgba(255, 255, 255, 0.2); color: #1C1C1E; }
        .btn-danger { background: rgba(255, 59, 48, 0.2); color: #FF3B30; }
        .btn-success { background: rgba(52, 199, 89, 0.3); color: #248A3D; }

        .flash { padding: 16px; border-radius: 16px; margin-bottom: 16px; font-size: 15px; font-weight: 500; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); }
        .flash.error { background: rgba(255, 59, 48, 0.2); color: #FF3B30; }
        .flash.success { background: rgba(52, 199, 89, 0.2); color: #248A3D; }
        
        a { color: #007AFF; text-decoration: none; transition: opacity 0.2s; }
        a:hover { opacity: 0.7; }
        
        .profile-row { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid rgba(0, 0, 0, 0.1); }
        .profile-row:last-child { border-bottom: none; }
        
        .label { color: #333; opacity: 0.7; font-weight: 500; font-size: 15px; }
        .value { font-weight: 600; color: #000; font-size: 16px; }

        /* =========================================
           НИЖНЕЕ МЕНЮ
           ========================================= */
        .bottom-nav {
            position: fixed; 
            bottom: 15px; 
            left: 15px; 
            right: 15px;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(30px) saturate(200%); 
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-radius: 999px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            padding: 6px 8px; 
            z-index: 99999;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255,255,255,0.9);
        }

        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: #666; 
            text-decoration: none; 
            font-size: 9px; 
            gap: 2px; 
            padding: 6px 8px; 
            border-radius: 999px;
            transition: all 0.2s ease; 
            text-align: center;
            flex: 1;
        }

        .nav-item:hover { text-decoration: none; color: #007AFF; }
        .nav-item.active { background: rgba(0, 122, 255, 0.1); color: #007AFF; font-weight: 600; }
        
        .nav-logo-mask {
            width: 20px; height: 20px; background: #ff6600;
            -webkit-mask: url('{{ url_for('static', filename='images/logo.png') }}') center / contain no-repeat;
            mask: url('{{ url_for('static', filename='images/logo.png') }}') center / contain no-repeat;
            margin-bottom: 1px; transition: background 0.2s;
        }
        .nav-item.active .nav-logo-mask { background: #007AFF; }

        /* =========================================
           ЧАТЫ (Мессенджер стиль)
           ========================================= */
        .chat-box { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            flex: 1;
            min-height: 0;
        }
        
        .chat-messages { 
            flex: 1; 
            overflow-y: auto; 
            background: transparent; 
            border-radius: 20px; 
            margin-bottom: 12px; 
            display: flex;
            flex-direction: column;
        }
        .chat-messages::-webkit-scrollbar { display: none; }
        .chat-messages { -ms-overflow-style: none; scrollbar-width: none; }
        
        .message-item { width: 100%; padding: 12px 16px; border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .message-item:last-child { border-bottom: none; }
        
        .message-author { font-weight: 600; margin-right: 5px; text-decoration: none; }
        .message-time { font-size: 12px; color: #666; margin-left: 5px; }
        .message-text { color: #000; word-break: break-word; margin-top: 4px; font-size: 15px; line-height: 1.4; }
        
        .chat-form { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            flex-shrink: 0; 
            margin-top: auto; 
        }
        .chat-form input { margin: 0; flex: 1; border-radius: 22px; padding: 12px 16px; }
        .chat-form button { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; background: rgba(255,255,255,0.4); color: #007AFF; flex-shrink: 0; }
        
        .mute-warning { background: rgba(255, 59, 48, 0.15); color: #FF3B30; padding: 16px; border-radius: 16px; text-align: center; font-size: 15px; font-weight: 600; border: 1px solid rgba(255, 59, 48, 0.2); margin-top: auto; }

        .chat-list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid rgba(0, 0, 0, 0.05); text-decoration: none; color: inherit; transition: background 0.2s; }
        .chat-list-item:active { background: rgba(255, 255, 255, 0.3); }
        .chat-list-item:last-child { border-bottom: none; }
        .chat-avatar { width: 48px; height: 48px; background: rgba(0, 122, 255, 0.8); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; margin-right: 16px; flex-shrink: 0; font-size: 20px; backdrop-filter: blur(5px); }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 600; font-size: 17px; color: #000; }
        .chat-last-msg { font-size: 15px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .chat-meta { text-align: right; font-size: 12px; color: #666; margin-left: 10px; }

        .dialog-header { display: flex; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(0, 0, 0, 0.1); flex-shrink: 0; }
        .dialog-header a { font-size: 24px; margin-right: 16px; color: #007AFF; text-decoration: none; }
        .dialog-header h2 { font-size: 18px; margin: 0; font-weight: 600; }
        
        .msg-row { display: flex; margin-bottom: 12px; }
        .msg-row.mine { justify-content: flex-end; }
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg-row:not(.mine) .msg-bubble { background: rgba(255, 255, 255, 0.7); color: #000; border-bottom-left-radius: 4px; backdrop-filter: blur(5px); }
        .msg-row.mine .msg-bubble { background: rgba(0, 122, 255, 0.9); color: white; border-bottom-right-radius: 4px; }

        .role-owner { color: #FF3B30; font-weight: 600; }
        .role-admin { color: #FF9500; font-weight: 600; }
        .role-moderator { color: #5E5CE6; font-weight: 600; }
        .role-user { color: #34C759; font-weight: 600; }
        .role-system { color: #AF52DE; font-weight: 600; font-style: italic; }
    
        /* Плавные переходы между страницами без резкого мигания */
        @view-transition {
            navigation: auto;
        }

        ::view-transition-old(root) {
            animation: page-fade-out 140ms ease both;
        }

        ::view-transition-new(root) {
            animation: page-fade-in 240ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
        }

        @keyframes page-fade-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-5px); }
        }

        @keyframes page-fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            ::view-transition-old(root),
            ::view-transition-new(root) {
                animation: none;
            }
        }
    
</style>
</head>
<body>

    <svg style="display: none;">
        <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" result="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="main-content">
        <div class="card">
            <div class="card-glass"></div>
            <div class="card-content">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for cat, msg in messages %}
                        <div class="flash {{ cat }}">{{ msg }}</div>
                    {% endfor %}
                {% endwith %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    {% if session.get('user_id') %}
    <nav class="bottom-nav">
        <a href="{{ url_for('profile') }}" class="nav-item {{ 'active' if request.path == '/profile' or request.path.startswith('/user/') }}">
            <div class="nav-logo-mask"></div> Профиль
        </a>
        <a href="{{ url_for('chat_sibiria') }}" class="nav-item {{ 'active' if request.path == '/chat_sibiria' or request.path == '/media_chat' or request.path.startswith('/chats/') }}">
            <div class="nav-logo-mask"></div> Медиа
        </a>
        <a href="{{ url_for('support') }}" class="nav-item {{ 'active' if request.path == '/support' }}">
            <div class="nav-logo-mask"></div> Фестивалю<br>быть
        </a>
        <a href="{{ url_for('masters') }}" class="nav-item {{ 'active' if request.path == '/masters' }}">
            <div class="nav-logo-mask"></div> Мастера<br>Сибирии
        </a>
        <a href="{{ url_for('administration') }}" class="nav-item {{ 'active' if request.path == '/administration' }}">
            <div class="nav-logo-mask"></div> Админы
        </a>
    </nav>
    {% endif %}
    <script>
    (() => {
        const contentSelector = '.card-content';
        let pageController = null;
        let pageIntervals = [];
        let isNavigating = false;

        function cleanupPage() {
            if (pageController) pageController.abort();
            pageController = null;
            pageIntervals.forEach(id => clearInterval(id));
            pageIntervals = [];
        }

        function runPageScripts(root) {
            cleanupPage();
            pageController = new AbortController();

            const originalSetInterval = window.setInterval;
            const originalAddEventListener = document.addEventListener;

            window.setInterval = function (...args) {
                const id = originalSetInterval.apply(window, args);
                pageIntervals.push(id);
                return id;
            };

            document.addEventListener = function (type, listener, options) {
                const opts = typeof options === 'boolean'
                    ? { capture: options, signal: pageController.signal }
                    : { ...(options || {}), signal: pageController.signal };
                return originalAddEventListener.call(document, type, listener, opts);
            };

            try {
                root.querySelectorAll('script').forEach(script => {
                    if (script.src) return;
                    const source = script.textContent || '';
                    const names = [...source.matchAll(/function\\s+([A-Za-z_$][\\w$]*)\\s*\\(/g)]
                        .map(match => match[1]);
                    const exports = [...new Set(names)]
                        .map(name => 'if (typeof ' + name + ' === "function") window.' + name + ' = ' + name + ';')
                        .join('\\n');

                    try {
                        new Function(source + '\\n' + exports)();
                    } catch (error) {
                        console.error('Ошибка скрипта страницы:', error);
                    }
                });
            } finally {
                window.setInterval = originalSetInterval;
                document.addEventListener = originalAddEventListener;
            }

            document.dispatchEvent(new Event('app:page-ready'));
        }

        async function navigate(url, options = {}) {
            if (isNavigating) return;
            const target = new URL(url, window.location.href);
            if (target.origin !== window.location.origin) {
                window.location.href = target.href;
                return;
            }

            const currentContent = document.querySelector(contentSelector);
            if (!currentContent) {
                window.location.href = target.href;
                return;
            }

            isNavigating = true;
            currentContent.classList.add('is-navigating');

            try {
                const response = await fetch(target.href, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'same-origin'
                });

                if (!response.ok || !response.headers.get('content-type')?.includes('text/html')) {
                    throw new Error('Не удалось загрузить страницу');
                }

                const html = await response.text();
                const nextDocument = new DOMParser().parseFromString(html, 'text/html');
                const nextContent = nextDocument.querySelector(contentSelector);

                if (!nextContent) throw new Error('Не найден контейнер страницы');

                cleanupPage();
                currentContent.innerHTML = nextContent.innerHTML;
                document.title = nextDocument.title || document.title;

                const oldNav = document.querySelector('.bottom-nav');
                const newNav = nextDocument.querySelector('.bottom-nav');
                if (oldNav && newNav) oldNav.replaceWith(newNav);
                else if (oldNav && !newNav) oldNav.remove();
                else if (!oldNav && newNav) document.body.appendChild(newNav);

                const finalUrl = new URL(response.url || target.href, window.location.href);
                if (options.history !== false) {
                    if (finalUrl.href === window.location.href) {
                        history.replaceState({}, '', finalUrl.href);
                    } else {
                        history.pushState({}, '', finalUrl.href);
                    }
                }

                currentContent.scrollTop = 0;
                currentContent.classList.remove('is-navigating');
                runPageScripts(currentContent);
            } catch (error) {
                console.error('AJAX-навигация не удалась:', error);
                window.location.href = target.href;
            } finally {
                isNavigating = false;
            }
        }

        document.addEventListener('click', event => {
            const link = event.target.closest('a[href]');
            if (!link || event.defaultPrevented || event.button !== 0 ||
                event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
                link.target || link.hasAttribute('download') ||
                link.getAttribute('href').startsWith('#') ||
                link.getAttribute('href').startsWith('javascript:') ||
                link.hasAttribute('data-no-ajax')) return;

            const url = new URL(link.href, window.location.href);
            if (url.origin !== window.location.origin) return;

            event.preventDefault();
            navigate(url.href);
        });

        document.addEventListener('submit', event => {
            if (event.defaultPrevented) return;
            const form = event.target;
            if (!(form instanceof HTMLFormElement) ||
                form.target || form.hasAttribute('data-no-ajax')) return;

            const method = (form.method || 'GET').toUpperCase();
            if (!['GET', 'POST'].includes(method)) return;

            const action = new URL(form.action || window.location.href, window.location.href);
            if (action.origin !== window.location.origin) return;

            event.preventDefault();
            const data = new FormData(form, event.submitter);
            if (method === 'GET') {
                for (const [key, value] of data.entries()) {
                    if (typeof value === 'string') action.searchParams.append(key, value);
                }
                navigate(action.href);
                return;
            }

            (async () => {
                try {
                    const response = await fetch(action.href, {
                        method: 'POST',
                        body: data,
                        credentials: 'same-origin',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });
                    if (!response.ok || !response.headers.get('content-type')?.includes('text/html')) {
                        throw new Error('Не удалось отправить форму');
                    }
                    const html = await response.text();
                    const finalUrl = response.url || action.href;
                    const nextDocument = new DOMParser().parseFromString(html, 'text/html');
                    const nextContent = nextDocument.querySelector(contentSelector);
                    if (!nextContent) throw new Error('Ответ не содержит страницу');
                    cleanupPage();
                    document.querySelector(contentSelector).innerHTML = nextContent.innerHTML;
                    document.title = nextDocument.title || document.title;

                    const oldNav = document.querySelector('.bottom-nav');
                    const newNav = nextDocument.querySelector('.bottom-nav');
                    if (oldNav && newNav) oldNav.replaceWith(newNav);
                    else if (oldNav && !newNav) oldNav.remove();
                    else if (!oldNav && newNav) document.body.appendChild(newNav);

                    if (new URL(finalUrl, window.location.href).href !== window.location.href) {
                        history.pushState({}, '', finalUrl);
                    }
                    const content = document.querySelector(contentSelector);
                    content.scrollTop = 0;
                    runPageScripts(content);
                } catch (error) {
                    console.error('AJAX-отправка формы не удалась:', error);
                    form.submit();
                }
            })();
        });

        window.addEventListener('popstate', () => navigate(window.location.href, { history: false }));
        runPageScripts(document.querySelector(contentSelector) || document);
    })();
    </script>
\n</body>
</html>
